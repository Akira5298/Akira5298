name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate cyan snake illustrations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%230b1220,%23164e63,%230e7490,%2306b6d4,%2367e8f9
            dist/github-snake-light.svg?palette=github-light&color_snake=%230891b2&color_dots=%23f1f5f9,%23cffafe,%2367e8f9,%2306b6d4,%230e7490
      - name: Publish generated snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: false
          keep_files: true
